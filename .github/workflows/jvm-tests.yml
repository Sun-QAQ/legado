name: JVM regression tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM regression tests
        run: bash ./gradlew :modules:book:testDebugUnitTest :modules:rhino:testDebugUnitTest :app:testAppDebugUnitTest --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            modules/book/build/reports/tests/
            modules/rhino/build/reports/tests/
